<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Boy</title>
<style>
*{box-sizing:border-box}html,body,main{width:100%;height:100%;margin:0;overflow:hidden}
main{position:relative;background:radial-gradient(ellipse at 45% 32%,#d7dfd3 0%,#b5c2b6 52%,#909f96 100%)}
canvas{position:absolute;inset:0;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
#status{position:absolute;bottom:1rem;width:100%;text-align:center;font:14px system-ui;color:#38483e}
#console-state{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body><main aria-label="Game Boy 3D preview"><span id="console-state" role="status">Power off.</span><div id="status" role="status">Loading Game Boy…</div></main><script type="module" src="/main.js"></script></body></html>
